[package]
name = "roughenough-reporting-server"
description = "Web server for collecting and storing Roughtime malfeasance reports"
license = "Apache-2.0 OR MIT"
version.workspace = true
edition.workspace = true
repository = "https://github.com/int08h/roughenough"
homepage = "https://github.com/int08h/roughenough"
readme = "../../README.md"
keywords = ["roughtime", "malfeasance", "reporting", "server", "web"]
categories = ["network-programming", "web-programming"]
# Not published to crates.io
publish = false

[[bin]]
name = "roughenough_reporting_server"
path = "src/main.rs"

[dependencies]
roughenough-client = { workspace = true }
roughenough-common = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
jiff = { workspace = true, features = ["serde"] }
data-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
roughenough-client = { workspace = true, features = ["test-utils"] }
roughenough-protocol = { workspace = true }
roughenough-server = { workspace = true, features = ["test-utils"] }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }