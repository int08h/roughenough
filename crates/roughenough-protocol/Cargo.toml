[package]
name = "roughenough-protocol"
description = "Core Roughtime protocol wire format handling and data structures"
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["roughtime", "protocol", "time-sync", "cryptography", "rfc"]
categories = ["network-programming", "cryptography"]

[lib]
name = "roughenough_protocol"
bench = false

[features]
# Expose the raw TLV test message builders (testmsg) to other crates' tests
test-utils = []

[dependencies]
thiserror = { workspace = true }
pastey = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
# self-dependency: enables test-utils (raw TLV builders) for the crate's own
# integration tests in tests/
roughenough-protocol = { path = ".", features = ["test-utils"] }

[[bench]]
name = "message_ops"
harness = false
test = false