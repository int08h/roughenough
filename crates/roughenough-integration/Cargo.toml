[package]
name = "roughenough-integration-test"
description = "End-to-end integration tests for Roughenough server and client"
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["roughtime", "integration", "testing", "e2e"]
categories = ["development-tools"]
# Test harness only; never published to crates.io
publish = false

[dependencies]
roughenough-common = { workspace = true }
roughenough-protocol = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }

[[bin]]
name = "roughenough_integration_test"
path = "src/main.rs"

[[bin]]
name = "roughenough_load_test"
path = "src/load_gen.rs"

