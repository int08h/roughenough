[package]
name = "roughenough-server"
description = "High-performance Roughtime UDP server with request batching"
license = "Apache-2.0 OR MIT"
edition.workspace = true
version.workspace = true
repository = "https://github.com/int08h/roughenough"
homepage = "https://github.com/int08h/roughenough"
readme = "../../README.md"
keywords = ["roughtime", "server", "time-sync", "udp", "async"]
categories = ["network-programming", "date-and-time"]

[[bin]]
name = "roughenough_server"
path = "src/main.rs"

[features]
test-utils = []
# Makes the pkcs11 seed backend available at runtime; without it, selecting
# pkcs11 fails with a "recompile with the feature" error
online-pkcs11 = ["roughenough-keys/online-pkcs11"]

[dependencies]
roughenough-common = { workspace = true }
roughenough-keys = { workspace = true }
roughenough-merkle = { workspace = true }
roughenough-protocol = { workspace = true }
aws-lc-rs = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
mio = { workspace = true, features = ["net", "os-poll"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
signal-hook = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
time-format = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# sendmmsg for batched response sends (network.rs mmsg module)
libc = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
roughenough-protocol = { workspace = true, features = ["test-utils"] }
# self-dependency: enables test-utils (worker panic injection, TestContext)
# when building this crate's own tests/ targets
roughenough-server = { path = ".", features = ["test-utils"] }

[[bench]]
name = "server_ops"
path = "benches/server_ops.rs"
harness = false