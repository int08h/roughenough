[package]
name = "roughenough-server"
description = "High-performance Roughtime UDP server with request batching"
license.workspace = true
edition.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["roughtime", "server", "time-sync", "udp", "async"]
categories = ["network-programming", "date-and-time"]

[[bin]]
name = "roughenough_server"
path = "src/main.rs"

[features]
test-utils = []
# Each forwards a roughenough-keys backend so a server-only build can select
# it; without one, selecting that backend or seed scheme fails at runtime with
# a "recompile with the feature" error
online-pkcs11 = ["roughenough-keys/online-pkcs11"]
online-ssh-agent = ["roughenough-keys/online-ssh-agent"]
longterm-aws = ["roughenough-keys/longterm-aws"]
longterm-gcp = ["roughenough-keys/longterm-gcp"]
# Everything a shipped server binary supports; never includes test-utils.
# Add any new roughenough-keys backend here too.
release = ["online-pkcs11", "online-ssh-agent", "longterm-aws", "longterm-gcp"]

[package.metadata.dist]
features = ["release"]

[dependencies]
roughenough-common = { workspace = true }
roughenough-keys = { workspace = true }
roughenough-merkle = { workspace = true }
roughenough-protocol = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
mio = { workspace = true, features = ["net", "os-poll"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
signal-hook = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
time-format = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
# sendmmsg for batched response sends (network.rs mmsg module)
libc = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
roughenough-protocol = { workspace = true, features = ["test-utils"] }
# self-dependency: enables test-utils (TestContext and test helpers)
# when building this crate's own tests/ targets
roughenough-server = { path = ".", features = ["test-utils"] }

[[bench]]
name = "server_ops"
path = "benches/server_ops.rs"
harness = false
