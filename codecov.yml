comment:
  layout: "condensed_header, diff, flags, components"

component_management:
  individual_components:
    - component_id: protocol
      name: Roughtime Protocol
      paths:
        - crates/roughenough-protocol/src/**
        - crates/roughenough-merkle/src/**
        - crates/roughenough-common/src/**
        - crates/roughenough-keys/src/**
    - component_id: client
      name: Client
      paths:
        - crates/roughenough-client/src/**
    - component_id: server
      name: Server
      paths:
        - crates/roughenough-server/src/**
    - component_id: reporting
      name: Reporting Server
      paths:
        - crates/roughenough-reporting-server/src/**
