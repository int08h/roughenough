name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # Disable incremental compilation for CI to avoid cache bloat
  CARGO_INCREMENTAL: 0
  # Use a consistent toolchain version for better caching
  RUST_VERSION: stable
  # Domain socket for ssh-agent seed backend tests
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

jobs:
  clippy:
    name: Clippy (Linting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rustfmt:
    name: Rustfmt (Code Formatting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo deny check

  # The all-features jobs above never compile roughenough-keys with a single
  # backend enabled; this matrix guards the per-feature cfg gates (notably
  # the optional tokio dependency of the longterm-* cloud backends)
  keys-features:
    name: Keys Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--features online-pkcs11"
          - "--features online-ssh-agent"
          - "--features longterm-aws"
          - "--features longterm-gcp"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Check feature combination
        run: cargo check -p roughenough-keys --all-targets ${{ matrix.features }}

  # fuzz/ is excluded from the workspace, so no other job compiles the fuzz
  # targets; this job keeps them from bit-rotting
  fuzz-build:
    name: Fuzz Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz targets
        run: cargo fuzz build

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    # For the sshagent seed backend tests
    - name: Start SSH Agent
      run: ssh-agent -a $SSH_AUTH_SOCK > /dev/null

    - name: Run tests with coverage
      run: cargo llvm-cov --workspace --all-features --no-report

    # llvm-cov does not run doctests on stable
    - name: Run doctests
      run: cargo test --doc --workspace --all-features

    - name: Coverage reports
      run: |
        cargo llvm-cov report --lcov --output-path lcov.info
        cargo llvm-cov report --html
        cargo llvm-cov report --summary-only

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./lcov.info
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: target/llvm-cov/html/
        retention-days: 30

  build-artifacts:
    name: Build Release Artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: ${{ env.RUST_VERSION }}

    - name: Install cargo-auditable
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-auditable

    - name: Build binaries
      run: |
        cargo auditable build --release -p roughenough-client --features reporting
        cargo auditable build --release -p roughenough-server --features release
        cargo auditable build --release -p roughenough-keys --all-features

    - name: Strip binaries
      run: |
        strip target/release/roughenough_client
        strip target/release/roughenough_server
        strip target/release/roughenough_keys

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp target/release/roughenough_client artifacts/
        cp target/release/roughenough_server artifacts/
        cp target/release/roughenough_keys artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: roughenough-x86_64-unknown-linux-gnu
        path: artifacts/
        retention-days: 90
